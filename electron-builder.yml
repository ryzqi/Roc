appId: com.roc.desktop
productName: Roc
npmRebuild: false
electronDist: node_modules/electron/dist
directories:
  output: release
electronLanguages:
  - en-US
  - zh-CN
files:
  - dist/**
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/node-pty/src/**"
  - "!node_modules/node-pty/typings/**"
  - "!node_modules/node-pty/scripts/**"
  - "!node_modules/node-pty/deps/**"
  - "!node_modules/node-pty/prebuilds/darwin-*/**"
  - "!node_modules/node-pty/prebuilds/win32-arm64/**"
  - "!node_modules/node-pty/third_party/conpty/**/win10-arm64/**"
extraResources:
  - from: resources/rtk-binaries
    to: rtk-binaries
    filter:
      - win32-x64/**
  - from: resources/icon.ico
    to: icon.ico
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
beforePack: ./scripts/builder-hooks/before-pack.mjs
afterExtract: ./scripts/builder-hooks/after-extract.mjs
afterPack: ./scripts/builder-hooks/after-pack.mjs
win:
  icon: resources/icon.ico
  executableName: Roc
  signAndEditExecutable: false
  target:
    - dir
  artifactName: Roc-${version}.${ext}
