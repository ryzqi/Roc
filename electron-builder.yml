appId: com.roc.desktop
productName: Roc
npmRebuild: false
electronDist: node_modules/electron/dist
directories:
  output: release
electronLanguages:
  - en-US
  - zh-CN
files:
  - dist/**
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/.DS_Store"
  - "!dist/renderer/.vite/**"
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/node-pty/src/**"
  - "!node_modules/node-pty/typings/**"
  - "!node_modules/node-pty/scripts/**"
  - "!node_modules/node-pty/deps/**"
  - "!node_modules/node-pty/lib/**/*.test.js"
  - "!node_modules/node-pty/lib/test/**"
  - "!node_modules/pdfjs-dist/build/**"
  - "!node_modules/pdfjs-dist/web/**"
  - "!node_modules/pdfjs-dist/types/**"
  - "!node_modules/pdfjs-dist/image_decoders/**"
  - "!node_modules/pdfjs-dist/legacy/web/**"
  - "!node_modules/pdfjs-dist/legacy/image_decoders/**"
extraResources:
  - from: resources
    to: .
    filter:
      - trayTemplate*.png
      - trayTemplate@2x.png
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
  - node_modules/@napi-rs/canvas/**
  - node_modules/@napi-rs/canvas-darwin-${arch}/**
  - node_modules/pdfjs-dist/**
beforePack: ./scripts/builder-hooks/before-pack.mjs
afterExtract: ./scripts/builder-hooks/after-extract.mjs
afterPack: ./scripts/builder-hooks/after-pack.mjs
mac:
  executableName: Roc
  icon: resources/icon.icns
  category: public.app-category.productivity
  target:
    - zip
  artifactName: Roc-${version}-mac-${arch}.${ext}
  files:
    - dist/**
    - package.json
    - "!dist/**/*.map"
    - "!dist/renderer/.vite/**"
    - "!node_modules/better-sqlite3/prebuilds/!(darwin-${arch}).node"
    - "!node_modules/node-pty/prebuilds/!(darwin-${arch})/**"
    - "!node_modules/node-pty/third_party/**"
    - "!node_modules/node-pty/node_modules/node-addon-api/**"
    - "!node_modules/@napi-rs/canvas-linux-*/**"
    - "!node_modules/@napi-rs/canvas-win32-*/**"
    - "!node_modules/@napi-rs/canvas-android-*/**"
    - "!node_modules/@napi-rs/canvas-darwin-!(${arch})/**"
    - "!node_modules/pdfjs-dist/build/**"
    - "!node_modules/pdfjs-dist/web/**"
    - "!node_modules/pdfjs-dist/types/**"
    - "!node_modules/pdfjs-dist/image_decoders/**"
    - "!node_modules/pdfjs-dist/legacy/web/**"
    - "!node_modules/pdfjs-dist/legacy/image_decoders/**"
  extraResources:
    - from: resources/rtk-binaries
      to: rtk-binaries
      filter:
        - darwin-${arch}/**
    - from: .runtime/research-toolchain/darwin-${arch}
      to: research-toolchain
      filter:
        - "**/*"
        - "!models"
        - "!models/**"
        - "!bibliography.py"
        - "!**/PyObjCTest"
        - "!**/PyObjCTest/**"
        - "!**/pip"
        - "!**/pip/**"
        - "!**/pip-*"
        - "!**/debugpy"
        - "!**/debugpy/**"
        - "!**/debugpy-*"
        - "!**/jedi"
        - "!**/jedi/**"
        - "!**/jedi-*"
        - "!**/IPython"
        - "!**/IPython/**"
        - "!**/ipython-*"
        - "!**/ipykernel"
        - "!**/ipykernel/**"
        - "!**/ipykernel-*"
        - "!**/faker"
        - "!**/faker/**"
        - "!**/faker-*"
        - "!**/polyfactory"
        - "!**/polyfactory/**"
        - "!**/polyfactory-*"
        - "!**/rapidocr"
        - "!**/rapidocr/**"
        - "!**/rapidocr-*"
        - "!**/torchgen"
        - "!**/torchgen/**"
        - "!**/torchgen-*"
        - "!**/torch/include"
        - "!**/torch/include/**"
        - "!**/torch/bin"
        - "!**/torch/bin/**"
        - "!**/torch/testing"
        - "!**/torch/testing/**"
        - "!python/include"
        - "!python/include/**"
        - "!**/__pycache__"
        - "!**/__pycache__/**"
        - "!**/*.pyc"
  identity: "-"
  hardenedRuntime: false
