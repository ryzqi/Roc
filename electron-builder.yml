appId: com.roc.desktop
productName: Roc Windows Super Assistant
npmRebuild: false
directories:
  output: release
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
win:
  signAndEditExecutable: false
  target:
    - dir
  artifactName: Roc-Windows-Super-Assistant-${version}.${ext}
