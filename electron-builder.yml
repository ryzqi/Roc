appId: com.roc.desktop
productName: Roc
npmRebuild: false
directories:
  output: release
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
beforePack: ./scripts/builder-hooks/before-pack.mjs
afterPack: ./scripts/builder-hooks/after-pack.mjs
afterAllArtifactBuild: ./scripts/builder-hooks/after-all-artifact-build.mjs
win:
  executableName: Roc
  signAndEditExecutable: false
  target:
    - dir
  artifactName: Roc-${version}.${ext}
