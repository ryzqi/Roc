[project]
name = "roc-research-runtime"
version = "0.1.0"
description = "Roc 科研工具运行时"
requires-python = ">=3.12.15,<3.13"
dependencies = [
  # Python here remains for plotting/data work; document parsing runs in the native JS/ONNX worker.
  "matplotlib==3.11.2",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
]

[tool.uv]
package = false
build-constraint-dependencies = ["setuptools==84.2.1"]
# 只钉上游「多放开了一个大版本」的传递依赖，避免裸锁自动跳 major。
constraint-dependencies = ["python-dateutil<3", "soupsieve<3"]
# 仅 Apple Silicon：Intel 构建、Rosetta 与旧架构钉版全部移除（proposal §3、§4）。
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
