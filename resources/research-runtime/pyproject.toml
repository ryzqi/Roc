[project]
name = "roc-research-runtime"
version = "0.1.0"
description = "Roc 科研工具运行时"
requires-python = ">=3.12.14,<3.13"
dependencies = [
  "docling==2.126.0",
  "docling-ibm-models==4.0.2",
  "pypdfium2==5.13.0",
  "ocrmac==1.0.1",
  "matplotlib==3.11.1",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "torch==2.14.0; platform_machine == 'arm64'",
  "torch==2.2.2; platform_machine == 'x86_64'",
  "torchvision==0.17.2; platform_machine == 'x86_64'",
  "transformers==4.51.3; platform_machine == 'x86_64'",
  "numpy==1.26.4; platform_machine == 'x86_64'",
]

[tool.uv]
package = false
build-constraint-dependencies = ["setuptools==84.0.0"]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
