# Roc 文稿检查配置（Vale）
#
# 这是随工具链打包的配置，不是用户配置。运行方式见
# `src/main/plugins/research/toolchain.ts` 的 `lintProse()`：显式传 `--config`、`--no-global`
# 与 `--output=JSON`，并被 `/usr/bin/sandbox-exec` 限制在 jobDir 与工具链根目录之间。
#
# `--no-global` 是要求，不是顺手：没有它 Vale 会去读 `$HOME/.vale.ini`、`$XDG_CONFIG_HOME`
# 与用户装的 style 包，同一份文稿在不同机器上就会给出不同结论。检查结果要进导出的溯源，
# 所以「同一输入必有同一输出」必须成立。
#
# 这里**不写** `--sort`、`--glob`、`Packages`：
#   * `--sort` 在 Vale 3.24.0 会报 `argument 'file' does not exist` 并以 E100 退出；
#   * `--glob` 同理，过滤由调用方按目标文件列表完成；
#   * `Packages = ` 会触发 `vale sync` 联网下载 style 包，与离线工具链冲突。
#
# `MinAlertLevel = suggestion` 也是要求：三档（error / warning / suggestion）全部返回，
# 由 Roc 侧决定哪些进闸门、哪些只做提示。用 severity 过滤会把「同一次检查」变成两份真相。

StylesPath = styles

MinAlertLevel = suggestion

Vocab = Roc

# 不检查代码、链接与图片替代文字：这些位置的词不属于论文正文。
IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure

# 中文规则与英文规则同时生效：两套规则集都基于 token 匹配，对另一种语言天然不命中，
# 所以不需要按文稿语言切换配置——切换配置会让「同一段文本在 zh 与 en 项目里结论不同」。
[*]
BasedOnStyles = RocAcademic, RocAcademicZh
