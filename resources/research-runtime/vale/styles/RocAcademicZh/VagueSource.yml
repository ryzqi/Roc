# 没有出处的「有研究表明」。Roc 的主张必须绑定 evidenceId，引用由 \cite{} 表达。
#
# error 级只给「把话归给一群无名研究者」的写法：这种表述读起来像有出处而没有，
# 正好是证据口径被破坏。`普遍认为` / `一般认为` 不收在这里，它们声称的是领域共识
# （有时确实存在），而**领域共识也要检索后才能断言**——所以在 Consensus.yml 里按 warning 提示。
extends: existence
message: "“%s” 读起来像有证据但没有出处：改成具体引用，或删掉。"
level: error
nonword: true
tokens:
  - (?:大量|许多|很多|多项|部分|一些)(?:研究|文献|工作|学者|实验)(?:表明|显示|指出|发现|认为|证明)
  - 有(?:研究|学者|文献|工作)(?:表明|显示|指出|发现|认为)
  - 已有研究表明
