# 领域共识类表述。warning 级，不是 error。
#
# `普遍认为` / `一般认为` 声称的不是「有人研究过」，而是「这个领域已经这么看」。这类断言有时
# 确实成立，但它同样是**关于文献的断言**，需要一次查全的检索来支撑——所以给 warning 提示核对，
# 而不是按「无出处」判为证据口径被破坏。把它混进 VagueSource 的 error 会让闸门把一句可讨论的
# 背景陈述当成错误，而一条会误判的 error 级规则会让人关掉整套检查。
#
# 英文一侧的对应规则在 `RocAcademic/Consensus.yml`。两套规则按语言分工而不是按文件分工，
# 因为两套 style 都会作用于每一份文稿；同一条命中只能由一个规则负责，因此 `一般认为`
# 已从 `Hedging.yml` 移到这里。
extends: existence
message: "“%s” 断言了领域共识：核对检索是否覆盖，或改成有出处的表述。"
level: warning
nonword: true
tokens:
  - 普遍认为
  - 一般认为
  - 学界共识
  - 业内公认
