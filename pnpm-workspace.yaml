strictPeerDependencies: false

# 同一版本按 peer 变体被重复实例化时（如 zod@4.6.5 / zod@4.6.7），
# langgraph 的 StateSchema 含 private symbol 属名义类型，跨实例会导致类型不兼容与运行时判等失败。
dedupePeerDependents: true

overrides:
  # 仅构建 macOS，移除非目标平台打包器。
  'app-builder-lib>electron-builder-squirrel-windows': '-'
  # langgraph 的 StateSchema 含 private symbol（名义类型），peer 链上出现两份就会类型不兼容、
  # 运行时判等失败。钉死到与根依赖一致的版本；**每次升 langgraph 必须同步改这一行**，
  # 否则安装会因 peer 冲突失败（见文首 dedupePeerDependents 的说明）。
  '@langchain/langgraph': 1.5.2
  # langchain/deepagents 允许 ^1.1.5，langgraph 要求 ^1.2.1，区间本身不冲突；
  # 留一条 override 避免锁文件留下两代 checkpoint 快照（BaseCheckpointSaver 跨实例）。
  '@langchain/langgraph-checkpoint': 1.2.1

ignoredOptionalDependencies:
  - '@esbuild/win32-*'
  - '@esbuild/linux-*'
  - '@esbuild/android-*'
  - '@esbuild/freebsd-*'
  - '@esbuild/aix-*'
  - '@esbuild/netbsd-*'
  - '@esbuild/openbsd-*'
  - '@esbuild/sunos-*'
  - '@esbuild/openharmony-*'
  - '@rolldown/binding-win32-*'
  - '@rolldown/binding-linux-*'
  - '@rolldown/binding-android-*'
  - '@rolldown/binding-openharmony-*'
  - '@rolldown/binding-freebsd-*'
  - '@typescript/typescript-win32-*'
  - '@typescript/typescript-linux-*'
  - '@typescript/typescript-aix-*'
  - '@typescript/typescript-freebsd-*'
  - '@typescript/typescript-netbsd-*'
  - '@typescript/typescript-openbsd-*'
  - '@typescript/typescript-sunos-*'
  - '@typescript/typescript-android-*'
  - 'lightningcss-win32-*'
  - 'lightningcss-linux-*'
  - 'lightningcss-android-*'
  - 'lightningcss-freebsd-*'
  - 'sqlite-vec-linux-*'
  - 'sqlite-vec-windows-*'
  - '@napi-rs/canvas-win32-*'
  - '@napi-rs/canvas-linux-*'
  - '@napi-rs/canvas-android-*'

allowBuilds:
  better-sqlite3: false
  electron: true
  esbuild: true
  node-pty: true
  onnxruntime-node: false

# pnpm 11+ 只从 workspace/config.yaml 读非鉴权设置。仓库 store 仍放 .runtime。
storeDir: .runtime/pnpm-store
cacheDir: .runtime/pnpm-cache
virtualStoreDir: node_modules/.pnpm

# pnpm 12 默认 minimumReleaseAge=1d。下列条目用于让 frozen install 通过年龄门禁：
# 每一次依赖升级轮次只保留当轮仍「未满 24h」的版本；已经成熟的旧条目在升级时删除
# （pnpm 的 minimumReleaseAgeExcludePrune 只清理“锁文件中已不存在的版本”，不会自动收缩本清单）。
# 本轮（2026-10-22T06:16Z 开始安装）中未满 24h 的版本：
#   vite@8.3.5                     2026-10-21T06:38Z
#   @napi-rs/canvas@1.0.13         2026-10-21T07:04Z
#   @langchain/langgraph@1.5.2     2026-10-21T19:43Z
#   @langchain/langgraph-checkpoint@1.2.1 2026-10-21T19:43Z
#   @langchain/langgraph-sdk@1.12.6      2026-10-21T19:46Z
# 末尾两条 `@napi-rs/canvas-darwin-*` 由 `pnpm install` 自动追加（同上 CHANGELOG #13687）。
minimumReleaseAgeExclude:
  - '@langchain/langgraph@1.5.2'
  - '@langchain/langgraph-checkpoint@1.2.1'
  - '@langchain/langgraph-sdk@1.12.6'
  - vite@8.3.5
  - '@napi-rs/canvas@1.0.13'
  - '@napi-rs/canvas-darwin-arm64@1.0.13'
  - '@napi-rs/canvas-darwin-x64@1.0.13'
